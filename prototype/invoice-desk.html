<!doctype html>
<!-- Developer: Ahsan Mahmood | https://aoneahsan.com -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice desk · Sledge</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #1c2d35;
        background: #f4f6f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #257d70;
        outline-offset: 3px;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
      }
      .rail {
        color: #ecf7f4;
        background: #123e3d;
        padding: 29px 22px;
        display: flex;
        flex-direction: column;
        gap: 34px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 35px;
        height: 35px;
        border-radius: 10px;
        color: #123e3d;
        background: #b9e4d4;
        font-size: 22px;
        font-weight: 900;
      }
      .rail-label {
        color: #8ebfba;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-weight: 800;
        margin: 4px 10px 14px;
      }
      .rail-link {
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 10px;
        color: #b9d4d0;
        background: transparent;
        padding: 12px 13px;
        font-weight: 650;
      }
      .rail-link.active {
        color: #fff;
        background: #29615d;
      }
      .rail-foot {
        margin-top: auto;
        color: #a8c9c4;
        border-top: 1px solid #31615d;
        padding: 20px 10px 0;
        font-size: 12px;
        line-height: 1.6;
      }
      .main {
        min-width: 0;
        padding: 28px clamp(22px, 4vw, 64px) 48px;
        max-width: 1550px;
        width: 100%;
        margin: auto;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #6a7d83;
        font-size: 13px;
        margin-bottom: 42px;
      }
      .topline strong {
        color: #234940;
      }
      .avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #d9ebe5;
        color: #1a5d52;
        font-weight: 800;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 31px;
      }
      .eyebrow {
        color: #17806c;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 850;
        margin: 0 0 9px;
      }
      h1 {
        font-size: clamp(30px, 3.4vw, 42px);
        line-height: 1.08;
        margin: 0;
        letter-spacing: -0.055em;
      }
      .intro p:last-child {
        color: #6d7f83;
        margin: 12px 0 0;
        font-size: 15px;
      }
      .summary {
        background: #e6f3ed;
        color: #27594e;
        padding: 13px 16px;
        border: 1px solid #cae4d7;
        border-radius: 12px;
        font-size: 13px;
        white-space: nowrap;
      }
      .summary b {
        font-size: 18px;
        margin-right: 6px;
      }
      .board {
        background: white;
        border: 1px solid #dce6e2;
        border-radius: 18px;
        box-shadow: 0 16px 46px #17453b0a;
        overflow: hidden;
      }
      .tabs {
        display: flex;
        padding: 0 25px;
        gap: 29px;
        border-bottom: 1px solid #e7eeeb;
        overflow-x: auto;
      }
      .tab {
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        color: #748488;
        padding: 20px 0 17px;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 750;
      }
      .tab[aria-selected="true"] {
        color: #14735f;
        border-bottom-color: #168970;
      }
      .tab span {
        color: #738786;
        background: #eef2f1;
        padding: 3px 7px;
        border-radius: 8px;
        margin-left: 6px;
        font-size: 11px;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(310px, 0.93fr) minmax(380px, 1.07fr);
        min-height: 560px;
      }
      .list {
        border-right: 1px solid #e7eeeb;
      }
      .list-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 24px 16px;
      }
      .list-head strong {
        font-size: 14px;
      }
      .list-head small {
        color: #81918d;
        font-size: 12px;
      }
      .invoice {
        display: grid;
        grid-template-columns: 39px minmax(0, 1fr) auto;
        gap: 13px;
        align-items: center;
        width: calc(100% - 20px);
        margin: 4px 10px;
        text-align: left;
        padding: 16px 13px;
        border: 1px solid transparent;
        background: white;
        border-radius: 12px;
        color: inherit;
      }
      .invoice:hover,
      .invoice.selected {
        background: #f3f9f6;
        border-color: #d5e8df;
      }
      .vendor-mark {
        width: 39px;
        height: 39px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: #24584e;
        background: #deeee6;
        font-size: 14px;
        font-weight: 850;
      }
      .invoice b,
      .invoice small {
        display: block;
      }
      .invoice b {
        font-size: 13px;
        margin-bottom: 5px;
      }
      .invoice small {
        font-size: 11px;
        color: #81918d;
      }
      .invoice .amount {
        font-size: 13px;
        font-weight: 850;
        white-space: nowrap;
        align-self: start;
        margin-top: 3px;
      }
      .tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 750;
        padding: 4px 7px;
        border-radius: 6px;
        margin-top: 7px;
        background: #fff0db;
        color: #946016;
      }
      .tag.good {
        background: #e2f2ea;
        color: #23745c;
      }
      .tag.bad {
        background: #fae6e6;
        color: #a14949;
      }
      .tag.neutral {
        background: #e9eef1;
        color: #617783;
      }
      .detail {
        padding: 29px 35px;
      }
      .detail-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }
      .detail-head small {
        color: #7e8f8e;
        font-size: 12px;
        font-weight: 700;
      }
      h2 {
        font-size: 25px;
        letter-spacing: -0.04em;
        margin: 7px 0 5px;
      }
      .detail-head p {
        color: #82918d;
        font-size: 13px;
        margin: 0;
      }
      .detail .tag {
        margin: 0;
        padding: 7px 9px;
      }
      .total {
        margin: 30px 0;
        padding: 24px;
        border: 1px solid #dfece5;
        background: #f7faf8;
        border-radius: 13px;
      }
      .total span {
        display: block;
        color: #82918d;
        font-size: 12px;
        margin-bottom: 7px;
      }
      .total strong {
        display: block;
        font-size: 31px;
        letter-spacing: -0.04em;
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin: 24px 0;
      }
      .field-label {
        display: block;
        font-size: 11px;
        color: #899894;
        margin-bottom: 6px;
      }
      .field-value {
        font-size: 13px;
        font-weight: 700;
      }
      .note {
        padding: 15px 16px;
        background: #fff8ec;
        border: 1px solid #f4dfbd;
        border-radius: 10px;
        color: #835c25;
        font-size: 12px;
        line-height: 1.5;
      }
      .note button {
        border: 0;
        background: none;
        color: #81501a;
        padding: 0;
        text-decoration: underline;
        font-weight: 750;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 28px;
      }
      .action {
        border: 1px solid #cad9d4;
        background: white;
        color: #31544d;
        padding: 12px 21px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 800;
      }
      .action.approve {
        color: white;
        background: #167d68;
        border-color: #167d68;
      }
      .action.reject {
        color: #a04644;
        border-color: #eac9c7;
      }
      .quiet {
        color: #82918d;
        font-size: 12px;
        margin-top: 24px;
      }
      .empty {
        color: #748885;
        padding: 40px 25px;
        line-height: 1.5;
        font-size: 14px;
      }
      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 72px minmax(0, 1fr);
        }
        .rail {
          padding: 24px 14px;
        }
        .brand {
          font-size: 0;
        }
        .brand-mark {
          font-size: 22px;
        }
        .rail-label,
        .rail-link,
        .rail-foot {
          display: none;
        }
        .main {
          padding: 25px 22px;
        }
      }
      @media (max-width: 740px) {
        .shell {
          display: block;
        }
        .rail {
          height: 65px;
          padding: 14px 20px;
        }
        .brand {
          font-size: 20px;
        }
        .topline {
          margin: 0 0 28px;
        }
        .summary {
          display: none;
        }
        .workspace {
          display: block;
        }
        .list {
          border-right: 0;
          border-bottom: 1px solid #e7eeeb;
        }
        .detail {
          padding: 25px 23px;
        }
        .invoice {
          margin-bottom: 2px;
        }
      }
      @media (max-width: 420px) {
        .main {
          padding: 22px 12px;
        }
        .tabs {
          padding: 0 17px;
          gap: 18px;
        }
        .tab {
          font-size: 12px;
        }
        .fields {
          gap: 16px;
        }
        .detail {
          padding: 25px 19px;
        }
        .detail-head {
          gap: 8px;
        }
        h2 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand"><span class="brand-mark">S</span>Sledge</div>
        <nav aria-label="Workspace">
          <p class="rail-label">Workspace</p>
          <button class="rail-link active">Invoice desk</button>
        </nav>
        <div class="rail-foot">A clear view of every invoice decision.</div>
      </aside>
      <main class="main">
        <div class="topline">
          <span>Workspace <b> / </b> <strong>Invoice desk</strong></span
          ><span class="avatar" aria-label="Ahsan Mahmood">AM</span>
        </div>
        <header class="intro">
          <div>
            <p class="eyebrow">Finance workspace</p>
            <h1>Invoice desk</h1>
            <p>Review invoices and keep each decision in one place.</p>
          </div>
          <div class="summary"><b id="reviewCount">2</b> need your review</div>
        </header>
        <section class="board" aria-label="Invoices">
          <div class="tabs" role="tablist" aria-label="Invoice status">
            <button class="tab" role="tab" data-tab="processing">
              Processing <span id="count-processing">1</span></button
            ><button class="tab" role="tab" data-tab="needs_review">
              Needs review <span id="count-needs_review">2</span></button
            ><button class="tab" role="tab" data-tab="decided">
              Approved–Rejected <span id="count-decided">2</span>
            </button>
          </div>
          <div class="workspace">
            <div class="list">
              <div class="list-head">
                <strong id="listTitle">Needs review</strong
                ><small id="listCount">2 invoices</small>
              </div>
              <div id="invoiceList"></div>
            </div>
            <div class="detail" id="invoiceDetail"></div>
          </div>
        </section>
      </main>
    </div>
    <script>
      // Developer: Ahsan Mahmood | Prototype state persists for review only.
      const key = "sledge-invoice-prototype-v1";
      const initial = [
        {
          id: "inv-1001",
          vendor: "Northline Steel",
          number: "NS-2408",
          amount: 842550,
          date: "2026-09-24",
          due: "2026-10-24",
          description: "Structural steel delivery",
          status: "approved",
        },
        {
          id: "inv-1002",
          vendor: "Northline Steel",
          number: "NS-2408",
          amount: 842550,
          date: "2026-09-25",
          due: "2026-10-24",
          description: "Structural steel delivery",
          status: "needs_review",
          duplicateOf: "inv-1001",
        },
        {
          id: "inv-1003",
          vendor: "Cedar Electric",
          number: "CE-1842",
          amount: 316400,
          date: "2026-09-23",
          due: "2026-10-23",
          description: "Electrical rough-in materials",
          status: "needs_review",
        },
        {
          id: "inv-1004",
          vendor: "Atlas Concrete",
          number: "AC-5901",
          amount: 1250000,
          date: "2026-09-21",
          due: "2026-10-21",
          description: "Foundation concrete",
          status: "processing",
        },
        {
          id: "inv-1005",
          vendor: "Harbor Plumbing",
          number: "HP-7712",
          amount: 189775,
          date: "2026-09-18",
          due: "2026-10-18",
          description: "Pipe fittings",
          status: "rejected",
        },
      ];
      let invoices;
      try {
        invoices = JSON.parse(localStorage.getItem(key)) || initial;
      } catch {
        invoices = initial;
      }
      let tab = "needs_review";
      let selected = "inv-1002";
      const money = (cents) =>
        new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
        }).format(cents / 100);
      const label = (status) =>
        ({
          processing: "Processing",
          needs_review: "Needs review",
          approved: "Approved",
          rejected: "Rejected",
        })[status];
      const tag = (status) =>
        `<span class="tag ${status === "approved" ? "good" : status === "rejected" ? "bad" : status === "processing" ? "neutral" : ""}">${label(status)}</span>`;
      const current = () =>
        invoices
          .filter((i) =>
            tab === "decided"
              ? ["approved", "rejected"].includes(i.status)
              : i.status === tab,
          )
          .sort((a, b) => b.date.localeCompare(a.date));
      function render() {
        const rows = current();
        if (!rows.some((i) => i.id === selected)) selected = rows[0]?.id;
        document.querySelectorAll(".tab").forEach((button) => {
          const active = button.dataset.tab === tab;
          button.setAttribute("aria-selected", String(active));
          button.tabIndex = active ? 0 : -1;
        });
        document.getElementById("count-processing").textContent =
          invoices.filter((i) => i.status === "processing").length;
        document.getElementById("count-needs_review").textContent =
          invoices.filter((i) => i.status === "needs_review").length;
        document.getElementById("count-decided").textContent = invoices.filter(
          (i) => ["approved", "rejected"].includes(i.status),
        ).length;
        document.getElementById("reviewCount").textContent = invoices.filter(
          (i) => i.status === "needs_review",
        ).length;
        document.getElementById("listTitle").textContent =
          tab === "decided" ? "Approved–Rejected" : label(tab);
        document.getElementById("listCount").textContent =
          `${rows.length} invoice${rows.length === 1 ? "" : "s"}`;
        document.getElementById("invoiceList").innerHTML = rows.length
          ? rows
              .map(
                (i) =>
                  `<button class="invoice ${i.id === selected ? "selected" : ""}" data-id="${i.id}" aria-label="View ${i.vendor} invoice ${i.number}"><span class="vendor-mark">${i.vendor[0]}</span><span><b>${i.vendor}</b><small>${i.number} · ${i.date}</small>${i.duplicateOf ? '<span class="tag">Possible duplicate</span>' : ""}</span><span class="amount">${money(i.amount)}</span></button>`,
              )
              .join("")
          : '<p class="empty">No invoices in this tab.</p>';
        const i = invoices.find((row) => row.id === selected);
        if (!i) {
          document.getElementById("invoiceDetail").innerHTML =
            '<p class="empty">Select an invoice to see its details.</p>';
          return;
        }
        const original = invoices.find((row) => row.id === i.duplicateOf);
        document.getElementById("invoiceDetail").innerHTML =
          `<div class="detail-head"><div><small>INVOICE ${i.number}</small><h2>${i.vendor}</h2><p>${i.description}</p></div>${tag(i.status)}</div><div class="total"><span>Invoice total</span><strong>${money(i.amount)}</strong></div><div class="fields"><div><span class="field-label">Invoice date</span><span class="field-value">${i.date}</span></div><div><span class="field-label">Due date</span><span class="field-value">${i.due}</span></div><div><span class="field-label">Invoice number</span><span class="field-value">${i.number}</span></div><div><span class="field-label">Status</span><span class="field-value">${label(i.status)}</span></div></div>${original ? `<div class="note"><b>Possible duplicate</b><br>This matches an earlier invoice from ${original.vendor}. <button data-original="${original.id}">View original ${original.number}</button></div>` : ""}${i.status === "needs_review" ? '<div class="actions"><button class="action approve" data-decision="approved">Approve invoice</button><button class="action reject" data-decision="rejected">Reject</button></div>' : `<p class="quiet">${i.status === "processing" ? "This invoice is still processing." : "This decision is final."}</p>`}`;
      }
      document.addEventListener("click", (event) => {
        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          tab = tabButton.dataset.tab;
          render();
          return;
        }
        const row = event.target.closest("[data-id]");
        if (row) {
          selected = row.dataset.id;
          render();
          return;
        }
        const original = event.target.closest("[data-original]");
        if (original) {
          tab = "decided";
          selected = original.dataset.original;
          render();
          return;
        }
        const decision = event.target.closest("[data-decision]");
        if (decision) {
          const invoice = invoices.find((i) => i.id === selected);
          invoice.status = decision.dataset.decision;
          localStorage.setItem(key, JSON.stringify(invoices));
          tab = "decided";
          render();
        }
      });
      document.querySelector(".tabs").addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
        event.preventDefault();
        const tabs = [...document.querySelectorAll(".tab")];
        const index = tabs.findIndex((button) => button.dataset.tab === tab);
        tabs[
          (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) %
            tabs.length
        ].focus();
        tabs[
          (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) %
            tabs.length
        ].click();
      });
      render();
    </script>
  </body>
</html>
